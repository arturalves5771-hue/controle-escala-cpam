    <title>Ambulatório - CPAM - Controle de Escala</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4fbf7;
            color: #0f291e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #cce8d9;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            background-color: #15803d;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 20px;
        }

        h1 {
            font-size: 22px;
            color: #064e3b;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: #166534;
            font-weight: 600;
        }

        .unit-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #15803d;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .month-selector-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid #cce8d9;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px rgba(21, 128, 61, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }

        .month-display {
            font-size: 22px;
            font-weight: 800;
            color: #15803d;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .month-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .month-nav-btn {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 13px;
        }

        .month-nav-btn:hover {
            background: #dcfce7;
            color: #064e3b;
        }

        .month-picker, .filter-select {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid #86efac;
            font-size: 13px;
            font-weight: 600;
            color: #064e3b;
            outline: none;
            background: #f0fdf4;
            cursor: pointer;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f0fdf4;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #86efac;
            font-size: 13px;
            color: #166534;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background-color: #15803d; color: white; }
        .btn-primary:hover { background-color: #166534; }

        .btn-success { background-color: #047857; color: white; }
        .btn-success:hover { background-color: #065f46; }

        .btn-info { background-color: #0284c7; color: white; }
        .btn-info:hover { background-color: #0369a1; }

        .btn-dark { background-color: #064e3b; color: white; }
        .btn-dark:hover { background-color: #022c22; }

        .btn-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .btn-danger:hover { background-color: #fee2e2; }

        .btn-lock { background-color: #475569; color: white; }
        .btn-lock.unlocked { background-color: #b45309; color: white; }

        main {
            background: white;
            border-radius: 16px;
            border: 1px solid #cce8d9;
            box-shadow: 0 10px 15px -3px rgba(21, 128, 61, 0.04);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f0fdf4;
            border-bottom: 1px solid #cce8d9;
            padding: 14px 16px;
            text-transform: uppercase;
            color: #166534;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #f4fbf7;
            vertical-align: middle;
            transition: background-color 0.3s ease;
        }

        textarea.auto-expand {
            width: 100%;
            min-height: 38px;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            color: #0f291e;
            background: transparent;
            resize: none;
            overflow: hidden;
            outline: none;
            transition: all 0.2s;
            display: block;
            font-weight: 500;
        }

        textarea.auto-expand:disabled {
            color: #0f291e;
            cursor: default;
        }

        textarea.auto-expand:hover:not(:disabled) { border-color: #86efac; }
        textarea.auto-expand:focus:not(:disabled) {
            border-color: #15803d;
            background: white;
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15);
        }

        select.form-control-select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 14px;
            font-weight: 500;
            color: #0f291e;
            background: transparent;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        select.form-control-select:hover:not(:disabled) { border-color: #86efac; }
        select.form-control-select:focus:not(:disabled) {
            border-color: #15803d;
            background: white;
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15);
        }
        select.form-control-select:disabled {
            color: #0f291e;
            background: transparent;
            cursor: default;
        }

        .row-actions-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            position: relative;
        }

            width: 28px;
