<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulatório - CPAM - Controle de Escala</title>
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f0fdf4; /* Verde bem clarinho de fundo */
            color: #166534;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            max-width: 1150px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #bbf7d0;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            background-color: #16a34a; /* Verde principal */
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 20px;
        }

        .unit-title {
            font-size: 13px;
            font-weight: 700;
            color: #15803d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        h1 {
            font-size: 24px;
            color: #052e16;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: #4ade80;
        }

        .month-selector-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid #bbf7d0;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px rgba(22, 163, 74, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }

        .month-display {
            font-size: 22px;
            font-weight: 800;
            color: #15803d;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .month-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .month-nav-btn {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 13px;
        }

        .month-nav-btn:hover {
            background: #dcfce7;
            color: #052e16;
        }

        .month-picker {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid #86efac;
            font-size: 14px;
            font-weight: 600;
            color: #052e16;
            outline: none;
            background: #f0fdf4;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background-color: #16a34a; color: white; }
        .btn-primary:hover { background-color: #15803d; }

        .btn-success { background-color: #047857; color: white; }
        .btn-success:hover { background-color: #065f46; }

        .btn-dark { background-color: #064e3b; color: white; }
        .btn-dark:hover { background-color: #022c22; }

        .btn-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .btn-danger:hover { background-color: #fee2e2; }

        .btn-lock { background-color: #475569; color: white; }
        .btn-lock.unlocked { background-color: #b45309; color: white; }

        main {
            background: white;
            border-radius: 16px;
            border: 1px solid #bbf7d0;
            box-shadow: 0 10px 15px -3px rgba(22, 163, 74, 0.05);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f0fdf4;
            border-bottom: 1px solid #bbf7d0;
            padding: 14px 16px;
            font-size: 11px;
            text-transform: uppercase;
            color: #166534;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #f0fdf4;
            vertical-align: top;
        }

        textarea.auto-expand {
            width: 100%;
            min-height: 38px;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            color: #14532d;
            background: transparent;
            resize: none;
            overflow: hidden;
            outline: none;
            transition: all 0.2s;
            display: block;
        }

        textarea.auto-expand:disabled {
            color: #052e16;
            cursor: default;
        }

        textarea.auto-expand:hover:not(:disabled) { border-color: #86efac; }
        textarea.auto-expand:focus:not(:disabled) {
            border-color: #16a34a;
            background: white;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        .row-actions-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-row-action {
            background: #f0fdf4;
            border: none;
            color: #166534;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-row-action:hover:not(:disabled) {
            background: #dcfce7;
            color: #052e16;
        }
        .btn-row-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover:not(:disabled) {
            color: #dc2626;
            background-color: #fef2f2;
        }
        .btn-delete:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #15803d;
            padding: 0 5px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            main { border: none !important; box-shadow: none !important; }
            th, td { border: 1px solid #166534 !important; padding: 8px !important; }
            textarea { border: none !important; padding: 0 !important; }
            .print-month-header {
                display: block !important;
                font-size: 18pt;
                font-weight: bold;
                margin-bottom: 15px;
                color: #052e16;
            }
        }

        .print-month-header { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">
                <div class="header-icon no-print">
                    <i class="fa-solid fa-hospital"></i>
                </div>
                <div>
                    <div class="unit-title">Ambulatório - CPAM</div>
                    <h1>Controle de Escala</h1>
                    <p class="subtitle">Bloqueios de Agenda e Compensações de Horários</p>
                </div>
            </div>

            <div class="actions no-print">
                <button id="btnLock" onclick="toggleEditMode()" class="btn btn-lock">
                    <i class="fa-solid fa-lock"></i> Modo Edição (Bloqueado)
                </button>
                <button onclick="addRow()" id="btnAddRow" class="btn btn-primary" disabled style="opacity: 0.4; cursor: not-allowed;">
                    <i class="fa-solid fa-plus"></i> Nova Linha
                </button>
                <button onclick="saveData(true)" id="btnSave" class="btn btn-success" disabled style="opacity: 0.4; cursor: not-allowed;">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
                <button onclick="window.print()" class="btn btn-dark">
                    <i class="fa-solid fa-file-pdf"></i> Imprimir / PDF
                </button>
                <button onclick="clearAll()" id="btnClear" class="btn btn-danger" title="Limpar este mês" disabled style="opacity: 0.4; cursor: not-allowed;">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </header>

        <div class="month-selector-bar no-print">
            <div class="month-display">
                <i class="fa-regular fa-calendar-days text-emerald-600"></i>
                <span id="currentMonthLabel"></span>
            </div>
            
            <div class="month-controls">
                <button onclick="changeMonth(-1)" class="month-nav-btn"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
                <input type="month" id="monthPicker" class="month-picker" onchange="onMonthSelectChange()">
                <button onclick="changeMonth(1)" class="month-nav-btn">Próximo <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="print-month-header" id="printMonthLabel"></div>

        <main>
            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th style="width: 26
