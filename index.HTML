<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulatório - CPAM - Controle de Escala</title>
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f0fdf4;
            color: #064e3b; /* Verde bem escuro e legível */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            max-width: 1150px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #86efac;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            background-color: #15803d; /* Verde forte */
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 20px;
        }

        .unit-title {
            font-size: 14px;
            font-weight: 800;
            color: #14532d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        h1 {
            font-size: 24px;
            color: #022c22;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: #166534;
            font-weight: 600;
        }

        .month-selector-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid #86efac;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px rgba(22, 163, 74, 0.06);
            flex-wrap: wrap;
            gap: 12px;
        }

        .month-display {
            font-size: 22px;
            font-weight: 800;
            color: #064e3b;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .month-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .month-nav-btn {
            background: #f0fdf4;
            border: 1px solid #4ade80;
            color: #064e3b;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 13px;
        }

        .month-nav-btn:hover {
            background: #dcfce7;
            color: #022c22;
        }

        .month-picker {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid #4ade80;
            font-size: 14px;
            font-weight: 700;
            color: #022c22;
            outline: none;
            background: #f0fdf4;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background-color: #15803d; color: white; }
        .btn-primary:hover { background-color: #166534; }

        .btn-success { background-color: #047857; color: white; }
        .btn-success:hover { background-color: #065f46; }

        .btn-dark { background-color: #022c22; color: white; }
        .btn-dark:hover { background-color: #000000; }

        .btn-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .btn-danger:hover { background-color: #fee2e2; }

        .btn-lock { background-color: #334155; color: white; }
        .btn-lock.unlocked { background-color: #b45309; color: white; }

        main {
            background: white;
            border-radius: 16px;
            border: 1px solid #86efac;
            box-shadow: 0 10px 15px -3px rgba(22, 163, 74, 0.08);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #dcfce7;
            border-bottom: 2px solid #86efac;
            padding: 14px 16px;
            font-size: 12px;
            text-transform: uppercase;
            color: #064e3b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #f0fdf4;
            vertical-align: top;
        }

        textarea.auto-expand {
            width: 100%;
            min-height: 38px;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            color: #064e3b;
            background: transparent;
            resize: none;
            overflow: hidden;
            outline: none;
            transition: all 0.2s;
            display: block;
            font-weight: 500;
        }

        textarea.auto-expand:disabled {
            color: #022c22;
            cursor: default;
        }

        textarea.auto-expand:hover:not(:disabled) { border-color: #4ade80; }
        textarea.auto-expand:focus:not(:disabled) {
            border-color: #15803d;
            background: white;
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15);
        }

        .row-actions-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-row-action {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #064e3b;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-row-action:hover:not(:disabled) {
            background: #dcfce7;
            color: #022c22;
        }
        .btn-row-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover:not(:disabled) {
            color: #dc2626;
            background-color: #fef2f2;
        }
        .btn-delete:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #064e3b;
            font-weight: 600;
            padding: 0 5px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; color: black !important; }
            main { border: none !important; box-shadow: none !important; }
            th, td { border: 1px solid #064e3b !important; padding: 8px !important; }
            textarea { border: none !important; padding: 0 !important; color: black !important; }
            .print-month-header {
                display: block !important;
                font-size: 18pt;
                font-weight: bold;
                margin-bottom: 15px;
                color: #022c22;
            }
        }

        .print-month-header { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">
                <div class="header-icon no-print">
                    <i class="fa-solid fa-hospital"></i>
                </div>
                <div>
                    <div class="unit-title">Ambulatório - CPAM</div>
                    <h1>Controle de Escala</h1>
                    <p class="subtitle">Bloqueios de Agenda e Compensações de Horários</p>
                </div>
            </div>

            <div class="actions no-print">
                <button id="btnLock" onclick="toggleEditMode()" class="btn btn-lock">
                    <i class="fa-solid fa-lock"></i> Modo Edição (Bloqueado)
                </button>
                <button onclick="addRow()" id="btnAddRow" class="btn btn-primary" disabled style="opacity: 0.4; cursor: not-allowed;">
                    <i class="fa-solid fa-plus"></i> Nova Linha
                </button>
                <button onclick="saveData(true)" id="btnSave" class="btn btn-success" disabled style="opacity: 0.4; cursor: not-allowed;">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
                <button onclick="window.print()" class="btn btn-dark">
                    <i class="fa-solid fa-file-pdf"></i> Imprimir / PDF
                </button>
                <button onclick="clearAll()" id="btnClear" class="btn btn-danger" title="Limpar este mês" disabled style="opacity: 0.4; cursor: not-allowed;">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </header>

        <div class="month-selector-bar no-print">
            <div class="month-display">
                <i class="fa-regular fa-calendar-days" style="color: #15803d;"></i>
                <span id="currentMonthLabel"></span>
            </div>
            
            <div class="month-controls">
                <button onclick="changeMonth(-1)" class="month-nav-btn"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
                <input type="month" id="monthPicker" class="month-picker" onchange="onMonthSelectChange()">
                <button onclick="changeMonth(1)" class="month-nav-btn">Próximo <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="print-month-header" id="printMonthLabel"></div>

        <main>
            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th style="width: 26%;">Profissional</th>
                            <th style="width: 26%;">Especialidade</th>
                            <th style="width: 18%;">Data Bloqueio</th>
                            <th style="width: 18%;">Data Compensação</th>
                            <th style="width: 12%; text-align: center;" class="no-print">Ações / Ordem</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Linhas geradas dinamicamente -->
                    </tbody>
                </table>
            </div>
        </main>
        
        <footer class="no-print">
            <span id="statusText">Modo de Leitura (Clique em "Modo Edição" para alterar)</span>
            <span>Registros no mês: <strong id="rowCount" style="color: #064e3b;">0</strong></span>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = "https://ovgkpcunpvqrcucezxfp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DqaHG9ksL7GRBedbZU5WgA_PbvtIE9r";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentYearMonth = '';
        let isEditable = false; // Começa bloqueado

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            currentYearMonth = `${year}-${month}`;

            document.getElementById('monthPicker').value = currentYearMonth;
            loadMonthData();
        });

        function toggleEditMode() {
            if (!isEditable) {
                const senha = prompt("Digite a senha de edição:");
                if (senha === "AMB2903") {
                    isEditable = true;
                    atualizarEstadoEdicao();
                    alert("Modo de edição desbloqueado com sucesso!");
                } else if (senha !== null) {
                    alert("Senha incorreta!");
                }
            } else {
                isEditable = false;
                atualizarEstadoEdicao();
                alert("Modo de edição bloqueado novamente.");
            }
        }

        function atualizarEstadoEdicao() {
            const btnLock = document.getElementById('btnLock');
            const btnAdd = document.getElementById('btnAddRow');
            const btnSave = document.getElementById('btnSave');
            const btnClear = document.getElementById('btnClear');
            const textareas = document.querySelectorAll('textarea.auto-expand');
            const rowActions = document.querySelectorAll('.btn-row-action, .btn-delete');

            if (isEditable) {
                btnLock.innerHTML = '<i class="fa-solid fa-lock-open"></i> Modo Edição (Ativo)';
                btnLock.className = 'btn btn-lock unlocked';
                btnAdd.removeAttribute('disabled');
                btnAdd.style.opacity = '1';
                btnAdd.style.cursor = 'pointer';
                btnSave.removeAttribute('disabled');
                btnSave.style.opacity = '1';
                btnSave.style.cursor = 'pointer';
                btnClear.removeAttribute('disabled');
                btnClear.style.opacity = '1';
                btnClear.style.cursor = 'pointer';

                textareas.forEach(ta => ta.removeAttribute('disabled'));
                rowActions.forEach(el => {
                    el.removeAttribute('disabled');
                    el.style.opacity = '1';
                    el.style.cursor = 'pointer';
                });
                document.getElementById('statusText').textContent = 'Modo Edição Ativo - Sincronizando em tempo real';
            } else {
                btnLock.innerHTML = '<i class="fa-solid fa-lock"></i> Modo Edição (Bloqueado)';
                btnLock.className = 'btn btn-lock';
                btnAdd.setAttribute('disabled', 'true');
                btnAdd.style.opacity = '0.4';
                btnAdd.style.cursor = 'not-allowed';
                btnSave.setAttribute('disabled', 'true');
                btnSave.style.opacity = '0.4';
                btnSave.style.cursor = 'not-allowed';
                btnClear.setAttribute('disabled', 'true');
                btnClear.style.opacity = '0.4';
                btnClear.style.cursor = 'not-allowed';

                textareas.forEach(ta => ta.setAttribute('disabled', 'true'));
                rowActions.forEach(el => {
                    el.setAttribute('disabled', 'true');
                    el.style.opacity = '0.3';
                    el.style.cursor = 'not-allowed';
                });
                document.getElementById('statusText').textContent = 'Modo de Leitura (Bloqueado)';
            }
        }

        function updateMonthLabel() {
            const [year, month] = currentYearMonth.split('-');
            const date = new Date(year, month - 1, 2); // Garante fuso correto no ajuste do mês
            const monthName = date.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
            const formatted = monthName.charAt(0).toUpperCase() + monthName.slice(1);
            
            document.getElementById('currentMonthLabel').textContent = formatted;
            document.getElementById('printMonthLabel').textContent = 'Ambulatório - CPAM | Mês: ' + formatted;
        }

        function changeMonth(delta) {
            const [year, month] = currentYearMonth.split('-').map(Number);
            const newDate = new Date(year, month - 1 + delta, 1);
